name: Bug 报告
description: 报告可复现的错误、崩溃或不正确输出
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实发票、付款记录、个人信息、工作区备份或密钥。
        如必须提供样例，请先替换姓名、地址、订单号、发票号和付款信息。

  - type: dropdown
    id: distribution
    attributes:
      label: 使用方式
      options:
        - Windows 便携包
        - 从源码运行
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 例如 v1.2.0 或 git commit hash
      placeholder: v1.2.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 x64
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 出错步骤
      options:
        - 1. 选择模板
        - 2. 导入票据
        - 3. 确认票据
        - 4. 设置额度
        - 5. 填写入出库明细
        - 6. 检查并导出
        - 启动或工作区管理
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从创建工作区开始，列出最短且稳定的复现步骤。
      placeholder: |
        1. 创建工作区
        2. 导入一份已脱敏 PDF
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏后的错误文字或截图。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 说明 PDF 是电子版还是扫描版、是否使用自定义模板及 OCR 模式。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认本 Issue 及附件不含真实票据、个人信息、密钥或私人工作区。
          required: true
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
