name: 改进建议
description: 建议改进现有本地票据整理流程
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        项目优先完善现有六步流程。多人云审批、会计记账、税务申报和强制付费 API
        不属于当前核心范围。

  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 请描述实际使用中遇到的困难，而不仅是功能名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明你希望现有流程如何变化。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方法

  - type: dropdown
    id: privacy
    attributes:
      label: 是否保持本地优先且无需付费 API
      options:
        - 是
        - 不确定
        - 否，请说明理由
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 建议中不包含真实票据、个人信息或密钥。
          required: true
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
