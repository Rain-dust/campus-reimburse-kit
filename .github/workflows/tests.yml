name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall app core tools materials_desktop.py run_materials_desktop.py
      - name: Test inventory line extraction
        if: always()
        run: python -m unittest discover -s tests -p "test_inventory_line_extraction.py" -v
      - name: Test local OCR assets
        if: always()
        run: python -m unittest discover -s tests -p "test_local_ocr_assets.py" -v
      - name: Test local OCR worker
        if: always()
        run: python -m unittest discover -s tests -p "test_local_ocr_worker.py" -v
      - name: Test materials assistant
        if: always()
        run: python -m unittest discover -s tests -p "test_materials_assistant.py" -v
      - name: Test desktop routes
        if: always()
        run: python -m unittest discover -s tests -p "test_materials_desktop.py" -v
      - name: Test workspace storage
        if: always()
        run: python -m unittest discover -s tests -p "test_materials_workspace.py" -v
      - name: Test OCR providers
        if: always()
        run: python -m unittest discover -s tests -p "test_ocr_providers.py" -v
